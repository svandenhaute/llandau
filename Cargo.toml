[package]
name = "llandau"
version = "0.3.0"
edition = "2024"
description = "Smooth scientific slides drawn live, with interactive 3D views of atomic trajectories"
license = "MIT"

[lib]
name = "llandau"
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
egui_plot = "0.38.0"
glam = "0.34.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lyon = "1.0"
numpy = "0.30.0"
png = "0.18.1"
pollster = "1.0.1"
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
raw-window-handle = "0.6.2"
usvg = "0.48"
wgpu = "30.0.1"
winit = "0.30"

[profile.release]
lto = "thin"
strip = true
