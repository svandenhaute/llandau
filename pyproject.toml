[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "llandau"
version = "0.2.2"
description = "Smooth scientific slides drawn live, with interactive 3D views of atomic trajectories"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
dependencies = ["numpy"]

[project.optional-dependencies]
export = ["pillow"]  # landau pdf / png
plots = ["contourpy"]  # contour plots
test = ["pytest", "pillow"]

[project.scripts]
landau = "landau.cli:main"

[tool.maturin]
python-source = "python"
module-name = "landau._core"
features = ["pyo3/extension-module"]
