[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "present"
version = "0.1.0"
description = "Minimal scientific slide decks, drawn live (no videos)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "riemann_viewer>=0.4",  # draws and presents the decks (wheels on its GitHub releases)
]

[project.optional-dependencies]
cairosvg = ["cairosvg"]  # fallback SVG rasterizer when neither rsvg-convert nor inkscape is installed
export = ["pillow"]  # present pdf / png
test = ["pytest", "pillow"]

[project.scripts]
present = "present.render:main"
