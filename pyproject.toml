[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "llandau"
version = "0.5.2"
description = "Smooth scientific slides drawn live, with interactive 3D views of atomic trajectories"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
dependencies = ["numpy"]

[project.optional-dependencies]
export = ["pillow"]  # llandau pdf / png
plots = ["contourpy"]  # contour plots
video = ["imageio-ffmpeg"]  # the explorer's record button, llandau.video (ffmpeg)
test = ["pytest", "pillow"]

[project.scripts]
llandau = "llandau.cli:main"

[tool.maturin]
python-source = "python"
module-name = "llandau._core"
features = ["pyo3/extension-module"]
